
name: RaceDay Part 2 CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api.slnx

      - name: Clean solution
        run: dotnet clean RaceDay.Api.slnx --configuration Release

      - name: Build solution
        run: dotnet build RaceDay.Api.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay.Api.slnx --configuration Release --no-build --logger "console;verbosity=normal"
